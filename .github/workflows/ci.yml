name: CI

on:
  push:
    branches: [main, 'claude/new-session-n6t9kx']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  qualidade:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ceak
          POSTGRES_PASSWORD: ceak
          POSTGRES_DB: ceak
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ceak" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ceak:ceak@localhost:5432/ceak
      AUTH_SECRET: ci-only-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      AUTH_PROVIDER: local
      SEED_SENHA: ceak-dev-2026
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      NEXT_PUBLIC_GESTAO_URL: http://localhost:3002
      PIX_WEBHOOK_SECRET: ci-webhook-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      # Ajusta exclusivamente a formatação na branch de desenvolvimento.
      # O commit via GITHUB_TOKEN não dispara uma nova execução em cascata.
      - name: Aplicar Prettier e registrar ajustes
        if: github.event_name == 'push' && github.ref == 'refs/heads/claude/new-session-n6t9kx'
        run: |
          pnpm exec prettier --write .
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -u
            git commit -m 'style: apply Prettier to CEAK development branch'
            git push origin HEAD:claude/new-session-n6t9kx
          fi
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
