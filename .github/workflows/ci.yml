name: CI

on:
  push:
    branches: [main, 'claude/new-session-n6t9kx']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  formatacao:
    name: Formatação Prettier
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verificar formatação original
        run: pnpm format:check
        continue-on-error: true
      - name: Preparar correções Prettier para revisão
        run: |
          pnpm exec prettier --write .
          git diff --binary > prettier.patch
      - name: Disponibilizar patch de formatação
        uses: actions/upload-artifact@v4
        with:
          name: ceak-prettier-patch
          path: prettier.patch
          retention-days: 7
      - name: Falhar quando houver formatação pendente
        run: |
          if [ -s prettier.patch ]; then
            echo "Arquivos fora do padrão. Aplicar o patch do artefato ceak-prettier-patch."
            exit 1
          fi

  tipos:
    name: TypeScript (independente)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      DATABASE_URL: postgresql://ceak:ceak@localhost:5432/ceak
      CEAK_DB_SCHEMA: ceak_v2
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck

  qualidade:
    name: Lint, testes e build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ceak
          POSTGRES_PASSWORD: ceak
          POSTGRES_DB: ceak
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ceak" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ceak:ceak@localhost:5432/ceak
      CEAK_DB_SCHEMA: ceak_v2
      NEXT_PUBLIC_CEAK_E2E: sim
      CEAK_ENABLE_MOCK_PAYMENT_CONFIRMATION: sim
      AUTH_SECRET: ci-only-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      AUTH_PROVIDER: local
      SEED_SENHA: ceak-dev-2026
      SEED_CONFIRM: DESTRUIR_DADOS_DEMO
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      NEXT_PUBLIC_GESTAO_URL: http://localhost:3002
      PIX_WEBHOOK_SECRET: ci-webhook-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Validar instituição vazia e proteção de produção
        run: |
          node --check scripts/verificar-publicacao.mjs
          node scripts/verificar-publicacao.mjs
          if node scripts/verificar-publicacao.mjs --ambiente; then
            echo "ERRO: o portão de produção aceitou ambiente de teste inseguro."
            exit 1
          fi
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:deploy
      - name: Confirmar permissões mínimas e isolamento de segredos do RLS
        run: |
          node - <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const db = new Client({ connectionString: process.env.DATABASE_URL });
            await db.connect();
            try {
              const r = await db.query(`
                SELECT
                  has_schema_privilege('ceak_app','ceak_v2','USAGE') AS schema_ok,
                  has_table_privilege('ceak_app','ceak_v2.pessoa','SELECT') AS pessoa_ok,
                  has_table_privilege('ceak_app','ceak_v2.turma','INSERT') AS turma_ok,
                  has_table_privilege('ceak_app','ceak_v2.auditoria','INSERT') AS auditoria_ok,
                  has_table_privilege('ceak_app','ceak_v2.credencial','SELECT') AS segredo_exposto,
                  (SELECT relrowsecurity FROM pg_class WHERE oid='ceak_v2.turma'::regclass) AS turma_rls
              `);
              const p = r.rows[0];
              if (!p.schema_ok || !p.pessoa_ok || !p.turma_ok || !p.auditoria_ok ||
                  p.segredo_exposto || !p.turma_rls) {
                throw new Error('Falha no RLS e nas permissões de acesso do CEAK v2.');
              }
              // Nova fila Web Push deve existir e ser acessível só por funções autorizadas.
              const fila = await db.query(`
                SELECT
                  to_regclass('ceak_v2.entrega_push') IS NOT NULL AS tabela_ok,
                  (SELECT relrowsecurity FROM pg_class WHERE oid='ceak_v2.entrega_push'::regclass) AS rls_ativo,
                  has_table_privilege('ceak_app', 'ceak_v2.entrega_push', 'SELECT') AS select_ok,
                  has_table_privilege('ceak_app', 'ceak_v2.entrega_push', 'INSERT') AS insert_ok,
                  has_table_privilege('ceak_app', 'ceak_v2.entrega_push', 'UPDATE') AS update_indevido
              `);
              const q = fila.rows[0];
              if (!q.tabela_ok || !q.rls_ativo || !q.select_ok || !q.insert_ok || q.update_indevido) {
                throw new Error('Fila de notificações sem isolamento de permissões.');
              }
              console.log('RLS da fila de notificações verificado.');
                            console.log('RLS operacional ativo e credenciais sem exposição.');
            } finally {
              await db.end();
            }
          })().catch(err => { console.error(err); process.exitCode = 1; });
          NODE
      - name: Primeiro acesso sem dados de demonstração
        env:
          CEAK_BOOTSTRAP_CONFIRM: CRIAR_PRIMEIRO_ADMIN_REAL
          CEAK_ADMIN_NOME: Administrador de Homologação
          CEAK_ADMIN_EMAIL: homologacao@example.org
          CEAK_ADMIN_SENHA: Homologacao#Unica2026!Seguro
        run: |
          pnpm db:bootstrap
          # Segunda execução deve falhar, sem criar outro administrador.
          if pnpm db:bootstrap; then
            echo "ERRO: bootstrap permitiu segunda execução"
            exit 1
          fi
          node - <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const db = new Client({ connectionString: process.env.DATABASE_URL });
            await db.connect();
            try {
              const q = await db.query(
                'SELECT (SELECT COUNT(*)::int FROM ceak_v2.pessoa) AS pessoas, ' +
                '(SELECT COUNT(*)::int FROM ceak_v2.usuario) AS usuarios, ' +
                '(SELECT COUNT(*)::int FROM ceak_v2.evento) AS eventos, ' +
                '(SELECT COUNT(*)::int FROM ceak_v2.curso) AS cursos, ' +
                '(SELECT COUNT(*)::int FROM ceak_v2.lancamento) AS lancamentos'
              );
              const data = q.rows[0];
              if (data.pessoas !== 1 || data.usuarios !== 1 || data.eventos !== 0 ||
                  data.cursos !== 0 || data.lancamentos !== 0) {
                throw new Error('Primeiro acesso inseriu registros inesperados: ' + JSON.stringify(data));
              }
              console.log('Bootstrap inicial validado sem conteúdo fictício.');
            } finally {
              await db.end();
            }
          })().catch(err => { console.error(err); process.exitCode = 1; });
          NODE
      - run: pnpm db:seed
      - name: Validar isolamento de matriculas e consentimento
        run: pnpm --filter @ceak/gestao exec vitest run src/lib/segmentacaoAulas.test.ts
      - name: Validar recibos internos e bloqueio de pagamentos nao confirmados
        run: pnpm --filter @ceak/gestao exec vitest run src/lib/recibosDoacoes.test.ts
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
