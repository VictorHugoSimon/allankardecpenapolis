name: CI

on:
  push:
    branches: [main, 'claude/new-session-n6t9kx']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  qualidade:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ceak
          POSTGRES_PASSWORD: ceak
          POSTGRES_DB: ceak
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ceak" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ceak:ceak@localhost:5432/ceak
      CEAK_DB_SCHEMA: ceak_v2
      CEAK_ENABLE_MOCK_PAYMENT_CONFIRMATION: sim
      AUTH_SECRET: ci-only-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      AUTH_PROVIDER: local
      SEED_SENHA: ceak-dev-2026
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      NEXT_PUBLIC_GESTAO_URL: http://localhost:3002
      PIX_WEBHOOK_SECRET: ci-webhook-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      # Ajusta exclusivamente a formatação na branch de desenvolvimento.
      # O commit via GITHUB_TOKEN não dispara uma nova execução em cascata.
      - name: Aplicar Prettier e registrar ajustes
        if: github.event_name == 'push' && github.ref == 'refs/heads/claude/new-session-n6t9kx'
        run: |
          pnpm exec prettier --write .
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -u
            git commit -m 'style: apply Prettier to CEAK development branch'
            git push origin HEAD:claude/new-session-n6t9kx
          fi
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:deploy
      # O papel ceak_app tem políticas RLS em ceak_v2, mas a migração antiga
      # concede USAGE somente em public. No Postgres descartável da CI,
      # habilitamos USAGE no schema de homologação, nunca no legado real.
      - name: Permitir schema isolado ao papel RLS
        run: |
          node - <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const db = new Client({ connectionString: process.env.DATABASE_URL });
            await db.connect();
            try {
              await db.query('GRANT USAGE ON SCHEMA ceak_v2 TO ceak_app');
              await db.query('GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA ceak_v2 TO ceak_app');
              await db.query('GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA ceak_v2 TO ceak_app');
              // Manter as mesmas exclusões de segredos do RLS original.
              await db.query('REVOKE ALL ON ceak_v2.credencial, ceak_v2.codigo_acesso, ceak_v2.integracao_segredo FROM ceak_app');
            } finally {
              await db.end();
            }
          })().catch((err) => { console.error(err); process.exitCode = 1; });
          NODE
      - run: pnpm db:seed
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
